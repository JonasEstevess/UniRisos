<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Uni Risos</title>
<meta name="description" content="App da Uni Risos: agende, acompanhe e receba lembretes das suas consultas.">
<meta name="theme-color" content="#f2f3ea">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Uni Risos">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../assets/logo-selo.jpg">
<link rel="apple-touch-icon" href="../assets/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=Unbounded:wght@600;800&display=swap">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="shell">
  <div class="splash" id="splash" aria-hidden="true">
    <img src="../assets/icon-192.png" alt="" width="96" height="96">
  </div>
  <div class="banner" id="banner" hidden></div>
  <main id="view" class="view" aria-live="polite"></main>
  <nav class="tabs" id="tabs" aria-label="Navegação principal"></nav>
</div>
<div class="scrim" id="scrim" hidden></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" hidden></section>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="../js/firebase-config.js"></script>
<script src="../js/store.js"></script>
<script src="../js/servicos.js"></script>
<script src="../js/agenda.js"></script>
<script src="../js/backend.js"></script>
<script src="app.js"></script>
<script src="../js/pwa.js"></script>
</body>
</html>
